include:
  - project: "GNOME/citemplates"
    file: "flatpak/flatpak_ci_initiative.yml"
variables:
  FLATPAK_MODULE: "showtime-libmpv"

workflow:
    rules:
        # Run merge request pipelines, for main or release branches, for
        # manually triggered pipelines (source "web"), and tags, but not for
        # translation updates
        - if: ($CI_PIPELINE_SOURCE == "merge_request_event" ||
               $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED ||
               $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH ||
               $CI_COMMIT_BRANCH =~ /^gnome-.*$/ ||
               $CI_PIPELINE_SOURCE == "web") &&
              $CI_COMMIT_TITLE !~ /^Update.*translation$/

flatpak:
  extends: ".flatpak"
  variables:
    MANIFEST_PATH: "build-aux/flatpak/com.ivanbelousov.showtime-libmpv.json"
    RUNTIME_REPO: "https://dl.flathub.org/repo/flathub.flatpakrepo"
    APP_ID: "com.ivanbelousov.showtime-libmpv"
    BUNDLE: "com.ivanbelousov.showtime-libmpv.flatpak"
